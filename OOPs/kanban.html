<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            box-sizing: border-box;
        }
        h1{
            text-align: center;
        }
        .container{

            display: flex;
            justify-content: center;
            width: 100vw;
            gap: 10px;


        }
        .columns{
            margin: 5px;
            padding: 10px;
            min-height: 400px;
            min-width: 400px;
            border-radius: 10px;
            border: 2px solid black;
            background-color: antiquewhite;
        }

        .Task{
            background-color: aqua;
            border-radius: 10px;
            margin: 10px;
            
        }
    </style>
</head>
<body>
    
    <h1>Drag btw the columns</h1>
    <div class="container">

        <div class="columns" id="to-do">
            <h2>To-Do</h2>

            <div class="Task" draggable="true">Task 1</div>
        </div>
        
        <div class="columns" id="pending">
            <h2>Curently Doing</h2>
            <div class="Task" draggable="true">Task 2</div>
        </div>
    
        <div class="columns" id="completed">
            <h2>Completed</h2>
            <div class="Task" draggable="true">Task 3</div>
        </div>

    </div>

    <script>
        let task=document.querySelectorAll('.Task');
        let target=null;

        task.forEach(t=>{
            t.addEventListener('dragstart', (e)=>{
                target=e.target;
                console.log(target)
            })

            
        })

        let col=document.querySelectorAll('.columns');

        for(let ele of col){
            ele.addEventListener('dragover',(e)=>{
                e.preventDefault();
            })

            ele.addEventListener('drop', e=>{
                if(target && e.target.className=='columns'){
                    e.target.appendChild(target)
                }
            })
        }
    </script>
    
</body>
</html>
